<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/style_contact.css">
</head>
<body>

    <section class="top-page">
        <header>
            <div class="top-bar">
                <div class="logo-gauche">
                    <img src="Image/Logo_IUT_ACT_couleurs.png" alt="logo iut">
                    <img src="Image/logo2.png" alt="logo universite">
                </div>
                <div class="logo-droite">
                    <img src="Image/DL_02_BUT.png" alt="logo BUT">
                </div>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="presentation.html">Présentation du BUT</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>
    </section>

    <main>
        <!-- Bloc 1 : Titre et formulaire -->
        <section class="bloc-haut">
            <h1></h1>

            <form action="#" method="post">
                <div class="colonne-gauche">
                    <input type="text" name="prenom">
                    <input type="text" name="nom">
                    <input type="email" name="email">
                    <button type="button"></button>
                </div>

                <div class="colonne-droite">
                    <textarea name="message"></textarea>
                </div>
            </form>
        </section>

        <!-- Bloc 2 : Photo et renseignements -->
        <section class="bloc-bas">
            <div class="zone-photo">
                <img src="img/devanture_iut_rangueil.jpg" alt="Photo de l'IUT">
            </div>

            <div class="zone-infos">
                <div class="adresse">
                    <p></p>
                </div>

                <div class="carte">
                    <img src="img/carte.jpg" alt="Carte de l'IUT">
                </div>
            </div>
        </section>
    </main>

    <footer class="pied-de-page">
        <link rel="stylesheet" href="css/style_contact.css">
        <nav aria-label="Plan du site">
            <h2>Plan du site</h2>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li>
                    <a href="presentation.html">Présentation du BUT Informatique</a>
                    <ul>
                        <li><a href="competences.html">Compétences</a></li>
                    </ul>
                </li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <section>
            <h2>RGPD</h2>
            <p><a href="https://www.cnil.fr/">Consulter le site de la CNIL</a></p>
        </section>

        <section>
            <h2>Équipe C9</h2>
            <ul class="pied-de-page-equipe">
                <li>Arthur Phisbien</li>
                <li>Ethan Hosti</li>
                <li>Louisa Houguel</li>
                <li>Seifiddine Ben Jemia</li>
            </ul>
        </section>
    </footer>

</body>
</html>
